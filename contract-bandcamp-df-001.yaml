# Example Contract: Bandcamp UA Dispatcher Fix (Dogfood)
# Generated by Agentic Fieldbook v0.1.0 dogfood run

$schema: aos-contract-core-v1
contract_id: "BANDCAMP-DF-001"
revision: 1

objective:
  summary: "Remove Bandcamp plugin's hidden dependency on Tubifarry's FlexibleHttpDispatcher"
  detail: >
    Bandcamp plugin sets browser-like User-Agent headers on its HTTP requests so
    Bandcamp serves full search pages. Lidarr's built-in ManagedHttpDispatcher
    rejects any User-Agent other than Lidarr's own. Tubifarry registers a
    FlexibleHttpDispatcher that relaxes this check. Without Tubifarry installed
    first, all Bandcamp connection tests fail with 'User-Agent other than Lidarr
    not allowed'. The fix must let the plugin's browser UA through independently
    of Tubifarry.
  success_definition: >
    Plugin works when installed alone (no Tubifarry). Connection tests pass.
    Existing tests still pass. No behaviour change when Tubifarry IS installed.

scope:
  in_scope:
    - "Register a custom IHttpDispatcher or equivalent that permits the Bandcamp browser UA"
    - "Ensure the dispatcher is self-contained in this plugin (no Tubifarry dependency)"
    - "Add/update tests covering UA dispatch behavior"
    - "Verify existing test suite passes"
  exclusions:
    - "No changes to BandcampHttpClient request-building logic"
    - "No changes to BandcampDownloadClient or BandcampApiClient business logic"
    - "No changes to Lidarr core"

