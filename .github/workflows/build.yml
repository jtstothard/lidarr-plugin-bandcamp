name: Build and Release Plugin

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_NAME: Lidarr.Plugin.Bandcamp
  DOTNET_VERSION: '10.0.103'
  # AssemblyVersion pinned to a LOW major version for cross-version compatibility.
  # Lidarr uses non-deterministic 10.0.0.* which changes every build. .NET's assembly
  # binding requires an EXACT version match when the major version component is the same
  # (10.x.x vs 10.x.x). By pinning to a different major version (2.0.0.0), .NET's
  # PluginLoadContext falls through to the default AssemblyLoadContext which resolves
  # Lidarr.Core by simple name regardless of version. This is the same approach used by
  # Tubifarry (2.1.0.0), Deezer (3.0.0.4855), and other working Lidarr plugins.
  LIDARR_ASSEMBLY_VERSION: 2.0.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Clone Lidarr source
        run: |
          git clone --depth 1 --branch plugins https://github.com/Lidarr/Lidarr.git ext/Lidarr

      - name: Pin Lidarr assembly versions
        run: |
          # Pin Lidarr's non-deterministic AssemblyVersion (10.0.0.*) to a version with a
          # DIFFERENT major component. .NET's PluginLoadContext falls through to the default
          # ALC when it can't resolve the assembly. The default ALC has Lidarr.Core loaded at
          # 10.0.0.XXXX. When our plugin references 2.0.0.0, .NET resolves by simple name
          # (Lidarr.Core) without strict version matching because the major versions differ.
          # When we referenced 10.0.0.4200, .NET required an exact match and silently failed.
          sed -i'' -e "s/<AssemblyVersion>10\.0\.0\.\*<\/AssemblyVersion>/<AssemblyVersion>${{ env.LIDARR_ASSEMBLY_VERSION }}<\/AssemblyVersion>/g" ext/Lidarr/src/Directory.Build.props
          echo "Pinned Lidarr AssemblyVersion to ${{ env.LIDARR_ASSEMBLY_VERSION }}"
          grep AssemblyVersion ext/Lidarr/src/Directory.Build.props

      - name: Restore dependencies
        run: dotnet restore Lidarr.Plugin.Bandcamp.slnx -p:TreatWarningsAsErrors=false

      - name: Build
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"
          else
            VERSION_ARG="-p:Version=0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          dotnet build Lidarr.Plugin.Bandcamp.slnx -c Release --no-restore -p:TreatWarningsAsErrors=false "$VERSION_ARG"

      - name: Run tests
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"
          else
            VERSION_ARG="-p:Version=0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          dotnet test Lidarr.Plugin.Bandcamp.slnx --no-build -c Release --filter "FullyQualifiedName~Bandcamp" "$VERSION_ARG"

      - name: Verify plugin DLL
        run: |
          DLL="src/Lidarr.Plugin.Bandcamp/bin/Release/net8.0/${{ env.PLUGIN_NAME }}.dll"
          test -f "$DLL" || { echo "ERROR: Plugin DLL not found at $DLL"; exit 1; }
          echo "Plugin DLL: $DLL ($(stat -c%s "$DLL") bytes)"

      - name: Zip plugin
        run: |
          cd src/Lidarr.Plugin.Bandcamp/bin/Release/net8.0
          zip "${{ github.workspace }}/${{ env.PLUGIN_NAME }}.net8.0.zip" \
            "${{ env.PLUGIN_NAME }}.dll"
          echo "Created ${{ env.PLUGIN_NAME }}.net8.0.zip"
          ls -la "${{ github.workspace }}/${{ env.PLUGIN_NAME }}.net8.0.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}.net8.0
          path: src/Lidarr.Plugin.Bandcamp/bin/Release/net8.0/${{ env.PLUGIN_NAME }}.dll

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "## Changelog" > changelog.txt
          git log --oneline $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD | \
            awk '{print "- " substr($0, index($0,$2))}' >> changelog.txt || true
          cat changelog.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: changelog.txt
          draft: false
          prerelease: false
          files: |
            ${{ env.PLUGIN_NAME }}.net8.0.zip
