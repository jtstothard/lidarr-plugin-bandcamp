name: Build and Release Plugin

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_NAME: Lidarr.Plugin.Bandcamp
  DOTNET_VERSION: '10.0.103'
  # Fixed AssemblyVersion for Lidarr references — prevents binding failures at runtime.
  # Lidarr uses non-deterministic 10.0.0.* which changes every build. We pin to a
  # stable minimum version so the plugin DLL references Lidarr.Core/Common at a version
  # Lidarr's runtime can resolve via assembly unification. Pattern from TrevTV plugins.
  MINIMUM_LIDARR_VERSION: 10.0.0.4200

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Clone Lidarr source
        run: |
          git clone --depth 1 --branch develop https://github.com/Lidarr/Lidarr.git ext/Lidarr

      - name: Pin Lidarr assembly versions
        run: |
          # Overwrite Lidarr's non-deterministic AssemblyVersion (10.0.0.*) with a fixed
          # minimum version. This ensures our plugin DLL references Lidarr.Core/Common at a
          # stable version that Lidarr's runtime can resolve. Without this, the plugin fails
          # to load with "Could not load file or assembly 'Lidarr.Core, Version=10.0.0.XXXXX'".
          sed -i'' -e "s/<AssemblyVersion>10\.0\.0\.\*<\/AssemblyVersion>/<AssemblyVersion>$MINIMUM_LIDARR_VERSION<\/AssemblyVersion>/g" ext/Lidarr/src/Directory.Build.props
          echo "Pinned Lidarr AssemblyVersion to $MINIMUM_LIDARR_VERSION"
          grep AssemblyVersion ext/Lidarr/src/Directory.Build.props

      - name: Restore dependencies
        run: dotnet restore Lidarr.Plugin.Bandcamp.slnx

      - name: Build
        run: dotnet build Lidarr.Plugin.Bandcamp.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test Lidarr.Plugin.Bandcamp.slnx --no-build -c Release --filter "FullyQualifiedName~Bandcamp"

      - name: Verify plugin DLL
        run: |
          DLL="src/Lidarr.Plugin.Bandcamp/bin/Release/net8.0/${{ env.PLUGIN_NAME }}.dll"
          test -f "$DLL" || { echo "ERROR: Plugin DLL not found at $DLL"; exit 1; }
          echo "Plugin DLL: $DLL ($(stat -c%s "$DLL") bytes)"

      - name: Zip plugin
        run: |
          cd src/Lidarr.Plugin.Bandcamp/bin/Release/net8.0
          zip "${{ github.workspace }}/${{ env.PLUGIN_NAME }}.net8.0.zip" \
            "${{ env.PLUGIN_NAME }}.dll"
          echo "Created ${{ env.PLUGIN_NAME }}.net8.0.zip"
          ls -la "${{ github.workspace }}/${{ env.PLUGIN_NAME }}.net8.0.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}.net8.0
          path: src/Lidarr.Plugin.Bandcamp/bin/Release/net8.0/${{ env.PLUGIN_NAME }}.dll

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "## Changelog" > changelog.txt
          git log --oneline $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD | \
            awk '{print "- " substr($0, index($0,$2))}' >> changelog.txt || true
          cat changelog.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: changelog.txt
          draft: false
          prerelease: false
          files: |
            ${{ env.PLUGIN_NAME }}.net8.0.zip
