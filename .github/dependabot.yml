version: 2
# Each ecosystem gets one patch/minor group and one major group, so Dependabot
# opens at most two PRs per ecosystem a week. When a major breaks the build,
# add an ignore for it instead of leaving the major group red.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      nuget-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      nuget-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
