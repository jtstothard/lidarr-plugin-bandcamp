name: "Feature Request"
description: Suggest a feature or improvement
title: "[FEATURE] "
labels: ["enhancement"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: What do you want?
      description: Describe the feature and why it would be useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: How are you handling this today?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
